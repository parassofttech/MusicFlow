<!doctype html>
<html lang="en">
<head>
  <!-- Basic -->
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=5.0"
  />

  <!-- Title -->
  <title>
    MusicFlow - Listen Free Songs Online
  </title>

  <!-- SEO -->
  <meta
    name="description"
    content="MusicFlow is a modern music streaming platform where you can explore Bollywood, Punjabi, Haryanvi, Bhojpuri, Tamil, and IndiePop songs. Discover trending music, artists, playlists, and enjoy unlimited listening."
  />

  <meta
    name="keywords"
    content="MusicFlow, Music App, Online Music, Bollywood Songs, Punjabi Songs, Haryanvi Songs, Bhojpuri Songs, Tamil Songs, IndiePop Songs, Trending Songs, Free Music, Latest Songs 2026"
  />

  <meta name="author" content="MusicFlow" />
  <!-- <meta name="robots" content="index, follow" /> -->
  <meta name="theme-color" content="#0f172a" />
  <meta name="application-name" content="MusicFlow" />


  <link rel="manifest" href="/manifest.webmanifest" />

<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="MusicFlow" />

  <!-- Canonical -->
  <link rel="canonical" href="https://musicflow-song.vercel.app" />

  <!-- Favicon -->
  <link rel="icon" href="/mf-logo.png" />
  <link rel="apple-touch-icon" href="/mf-logo.png" />

  <!-- Open Graph -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="MusicFlow" />
  <meta
    property="og:title"
    content="MusicFlow - Free Online Music Streaming"
  />
  <meta
    property="og:description"
    content="Listen to Bollywood, Punjabi, Haryanvi, Bhojpuri, Tamil and IndiePop songs online with MusicFlow."
  />
  <meta property="og:url" content="https://musicflow-song.vercel.app" />
  <meta property="og:image" content="/mf-logo.png" />

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta
    name="twitter:title"
    content="MusicFlow - Free Music Streaming"
  />
  <meta
    name="twitter:description"
    content="Discover trending Bollywood, Punjabi, Tamil, Bhojpuri, IndiePop and more songs."
  />
  <meta name="twitter:image" content="/logo-musicflow.png" />

  <!-- Preload Logo -->
  <link rel="preload" href="/mf-logo.png" as="image" />

  <!-- JSON-LD -->
  <script type="application/ld+json">
  {
    "@context":"https://schema.org",
    "@type":"WebSite",
    "name":"MusicFlow",
    "url":"https://musicflow-song.vercel.app/",
    "description":"Modern music streaming website with Bollywood, Punjabi, Tamil, Bhojpuri, Haryanvi and IndiePop songs.",
    "potentialAction":{
      "@type":"SearchAction",
      "target":"https://musicflow-song.vercel.app/search?q={search_term_string}",
      "query-input":"required name=search_term_string"
    }
  }
  </script>

</head>

<body>

  <div id="root"></div>
  <div id="modal-root"></div>

  <script type="module" src="/src/main.jsx"></script>

  <!-- SPA Redirect -->
  <script>
    (function (l) {
      if (l.search[1] === "/") {
        var decoded = l.search
          .slice(1)
          .split("&")
          .map(function (s) {
            return s.replace(/~and~/g, "&");
          })
          .join("?");

        window.history.replaceState(
          null,
          null,
          l.pathname.slice(0, -1) + decoded + l.hash
        );
      }
    })(window.location);
  </script>

</body>
</html>
